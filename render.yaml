# Render Blueprint — ScamBuster server
# Cach dung: day thu muc nay len GitHub, vao Render > New > Blueprint,
# chon repo nay. Render se tu tao web service theo file nay.
# Luu y: goi free KHONG co o dia ben vung — du lieu SQLite se mat khi
# redeploy. Muon giu lau dai thi nang cap goi tra phi + gan disk (xem README).
services:
  - type: web
    name: scambuster-server
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATA_DIR
        value: ./data
      - key: STORE
        value: sqlite
    healthCheckPath: /api/health
