# Render Blueprint — ScamBuster server
# Cach dung: day thu muc nay len GitHub, vao Render > New > Blueprint,
# chon repo nay. Render se tu tao web service theo file nay.
# Luu tru ben: them bien DATABASE_URL (chuoi ket noi Neon Postgres) trong
# Render Dashboard > service > Environment (KHONG ghi chuoi that vao file
# nay). Neu chua co DATABASE_URL, server van chay bang SQLite tam thoi
# (du lieu se mat khi redeploy — chi dung tam).
services:
  - type: web
    name: scambuster-server
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATA_DIR
        value: ./data
      - key: STORE
        value: sqlite
      - key: DATABASE_URL
        sync: false # dat tay trong Dashboard: postgres://user:pass@ep-xxx...neon.tech/neondb?sslmode=require
    healthCheckPath: /api/health
